name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  formula:
    name: Formula
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Tap local checkout
        run: brew tap In-sp3ctr3/tap "$GITHUB_WORKSPACE"

      - name: Fetch formula artifact
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew fetch --formula In-sp3ctr3/tap/mempr

      - name: Install formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew install --formula In-sp3ctr3/tap/mempr
          "$(brew --prefix mempr)/bin/mempr"
          brew uninstall --formula In-sp3ctr3/tap/mempr

  cask:
    name: Cask
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Tap local checkout
        run: brew tap In-sp3ctr3/tap "$GITHUB_WORKSPACE"

      - name: Fetch cask artifact
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew fetch --cask In-sp3ctr3/tap/clack

      - name: Install cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          appdir="$(mktemp -d)"
          brew install --cask --appdir="$appdir" In-sp3ctr3/tap/clack
          test -d "$appdir/Clack.app"
          brew uninstall --cask In-sp3ctr3/tap/clack
