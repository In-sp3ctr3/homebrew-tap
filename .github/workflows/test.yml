name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cask:
    name: Cask
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Tap local checkout
        run: brew tap In-sp3ctr3/tap "$GITHUB_WORKSPACE"

      - name: Audit cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --new In-sp3ctr3/tap/clack

      - name: Fetch cask artifact
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew fetch --cask In-sp3ctr3/tap/clack
